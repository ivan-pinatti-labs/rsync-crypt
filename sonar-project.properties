# SonarQube Cloud analysis settings, read by .github/workflows/sonarqube.yml.
# The project was imported into SonarQube Cloud with Automatic Analysis turned
# off: this repository analyzes from CI, and the two cannot run side by side.
sonar.organization=ivan-pinatti-labs
sonar.projectKey=ivan-pinatti-labs_rsync-crypt
sonar.projectName=rsync-crypt

# Sources are the whole tree rather than a list of folders, so a new top level
# file or folder is analyzed without anyone remembering to add it here. Sonar
# only reads the languages it has an analyzer for (shell, Python, Dockerfile,
# YAML and GitHub Actions here) plus its secrets detection, which runs over
# every text file. tests/ is analyzed as test code, which Sonar holds to a
# different rule set, so it is excluded from sources to keep the two disjoint.
sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**,coverage/**,THIRD_PARTY_LICENSES.md,.secrets.baseline
sonar.test.inclusions=tests/**

# Matches ruff.toml's target-version and the interpreter CI runs, so Python
# rules that depend on the language version judge the code against the right
# one. tests/test_python_version_pin.py keeps the three in step.
sonar.python.version=3.14

# The two dotfiles the image copies into each home directory have no
# extension, so the shell analyzer would skip them; they are named here. The
# setting replaces the analyzer's own file patterns rather than adding to
# them, so the first two keep every .sh and .bash file in.
sonar.lang.patterns.shell=**/*.sh,**/*.bash,files/bash/.bashrc,files/bash/.bash_aliases

# Written by `make coverage` (sonarqube.yml's "Measure coverage" step), never
# committed. shell.xml is kcov's report of the shell, rewritten into
# SonarQube's generic coverage format by scripts/kcov-to-sonar.py, since
# SonarQube has no importer of its own for shell coverage. It lists the two
# dotfiles too, and SonarQube drops their lines ("Coverage data ignored for 2
# unknown files"): its generic coverage sensor skips files whose name starts
# with a dot, although the shell analyzer reads them. `make coverage` still
# holds them at 100%.
sonar.python.coverage.reportPaths=coverage/coverage.xml
sonar.coverageReportPaths=coverage/shell.xml

sonar.sourceEncoding=UTF-8
