# SonarQube Cloud analysis settings, read by .github/workflows/sonarqube.yml.
# The project was imported into SonarQube Cloud with Automatic Analysis turned
# off: this repository analyzes from CI, and the two cannot run side by side.
sonar.organization=ivan-pinatti-labs
sonar.projectKey=ivan-pinatti-labs_rsync-crypt
sonar.projectName=rsync-crypt

# Sources are the whole tree rather than a list of folders, so a new top level
# file or folder is analyzed without anyone remembering to add it here. Sonar
# only reads the languages it has an analyzer for (shell, Python, Dockerfile,
# YAML and GitHub Actions here) plus its secrets detection, which runs over
# every text file. tests/ is analyzed as test code, which Sonar holds to a
# different rule set, so it is excluded from sources to keep the two disjoint.
sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**,THIRD_PARTY_LICENSES.md,.secrets.baseline
sonar.test.inclusions=tests/**

# Matches ruff.toml's target-version and the interpreter CI runs, so Python
# rules that depend on the language version judge the code against the right
# one. tests/test_python_version_pin.py keeps the three in step.
sonar.python.version=3.14

# Written by sonarqube.yml's "Measure coverage" step, never committed.
sonar.python.coverage.reportPaths=coverage.xml

sonar.sourceEncoding=UTF-8
