---
# Hooks come from ivan-pinatti-labs/pre-commit-checklists. See docs/hook-catalogue.md
# in that repository for what each id runs, and CLAUDE.md here for the two
# selectors below that deviate from its shipped templates.
#
# checklist-git-commit-msg runs at the commit-msg git stage rather than
# pre-commit, so default_install_hook_types wires both stages up. Every other
# hook is pinned to stages: [pre-commit] so it does not also re-run,
# redundantly, during that commit-msg invocation. trivy-image-scan (below)
# runs at pre-push instead, for the same reason: it builds the image before
# scanning it, and that is too slow to run on every commit.
#
# There is deliberately no `ci:` block. That block configures pre-commit.ci,
# whose autofix_prs would commit and push fixes back to a pull request branch.
# CI here is a gate: a hook that finds something fixable fails the run and the
# author fixes it. See "CI never autofixes" in CLAUDE.md.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
repos:
  - repo: https://github.com/ivan-pinatti-labs/pre-commit-checklists
    rev: v2.2.5
    hooks:
      # Large-file, merge-conflict and line-ending hygiene. No selector needed.
      - id: checklist-basic
        stages: [pre-commit]

      # cspell over everything it can read; words live in .cspell.json.
      - id: checklist-spell
        stages: [pre-commit]

      # markdownlint-cli2 and markdown-link-check.
      - id: checklist-markdown
        types: [markdown]
        stages: [pre-commit]

      # check-json and Prettier. json5 is included because the only
      # JSON-family file here is .github/renovate.json5, and `identify` tags
      # that `json5`, not `json`, so a plain types: [json] would match nothing
      # at all. check-json self-filters on its own types: [json] and never
      # sees the json5 file, which is correct: it is a strict JSON parser and
      # renovate.json5 has comments and unquoted keys. Prettier reads json5
      # natively and formats it.
      - id: checklist-json
        types_or: [json, json5]
        stages: [pre-commit]

      # check-yaml, yamllint (config in .yamllint.yml), Prettier.
      - id: checklist-yaml
        types: [yaml]
        stages: [pre-commit]

      # detect-private-key and detect-secrets, against .secrets.baseline.
      - id: checklist-security-credentials
        stages: [pre-commit]

      # editorconfig-checker against .editorconfig. No selector needed.
      - id: checklist-dev-editorconfig
        stages: [pre-commit]

      # types: [shell] reaches files/bash/.bashrc and .bash_aliases as well as
      # scripts/*.sh: both are typed `shell` by identify despite having no
      # extension. That only works from v2.1.4 on. Before it, the hook's own
      # manifest baked in `files: \.(sh|bash)$`, which pre-commit ANDs with a
      # consumer's types:, silently dropping both dotfiles; this repo carried
      # a files: override to work around exactly that.
      - id: checklist-dev-shell
        types: [shell]
        stages: [pre-commit]

      # check-ast, check-builtin-literals, debug-statements, name-tests-test,
      # requirements-txt-fixer, ruff-check --fix, ruff-format.
      - id: checklist-dev-python
        files: '(\.py$|(^|/)requirements\.txt$)'
        stages: [pre-commit]

      # hadolint-docker. Its own types: [dockerfile] scopes it already.
      - id: checklist-dev-docker
        stages: [pre-commit]

      # actionlint-docker and zizmor.
      - id: checklist-github-actions
        files: ^\.github/
        stages: [pre-commit]

      # Rejects branch names outside the convention.
      - id: checklist-git-valid-branches
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Conventional Commits, at the commit-msg stage.
      - id: checklist-git-commit-msg
        stages: [commit-msg]
        files: ^\.git/COMMIT_EDITMSG$

      # Blocks direct commits to main/master/develop/staging.
      - id: checklist-git-protected-branches
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # dotenv-linter is run directly rather than through checklist-dev-dotenv.
  # That id cannot be passed --ignore-checks: every checklist-* id routes
  # through run-checklist.sh with the checklist name as its first argument, so
  # an args: entry replaces that name instead of reaching the tool. .env.example
  # quotes its values deliberately, which is one QuoteCharacter finding per
  # quoted value (14 today, and it moves with the file), and the library
  # documents this local-hook copy as the supported way out. Same image and
  # flags as checklists/checklist-dev-dotenv.yaml otherwise.
  - repo: local
    hooks:
      - id: dotenv-linter
        name: dotenv-linter (dotenv-linter/dotenv-linter, Rust)
        language: system
        files: '(^|/)\.env(\..+)?$'
        stages: [pre-commit]
        entry: >-
          bash -c '
          runtime=$(command -v docker || command -v podman) || {
          echo "dotenv-linter needs docker or podman on PATH." >&2;
          exit 1;
          };
          exec "${runtime}" run --rm -v "$(pwd):/src:ro,Z" -w /src
          docker.io/dotenvlinter/dotenv-linter:4.0.0 check --skip-updates
          --ignore-checks QuoteCharacter "$@"
          ' --

      # Builds the image locally and scans it with Trivy before it can be
      # pushed. pre-push, not pre-commit: a full multi-stage image build is
      # too slow to run on every commit, and Dockerfile/Makefile (the only
      # two files this scopes to) change far less often than the files the
      # other hooks above run against on every commit. This is a local
      # backstop for whoever is about to push; .github/workflows/publish-image.yml
      # runs the same scan, with the same .trivyignore.yaml, as the blocking
      # server-side gate for anyone who bypasses or skips this hook (a
      # `--no-verify` push, a fresh clone with hooks not installed yet).
      #
      # Scoped to the Dockerfile's own inputs: Makefile (the `make build`
      # invocation this mirrors, and the only other file that can change
      # build args), and scripts/ and files/bash/, which the Dockerfile
      # COPYs directly into the image. There is no .dockerignore narrowing
      # that build context, so any file under either directory can change
      # what actually ships. Every other file in the repo can change
      # without the image itself changing, so there is no reason to pay for
      # a rebuild-and-scan on, say, a docs or workflow-only push.
      #
      # cleanup()'s own `|| true` on the image-removal command is not the
      # general error suppression this file otherwise avoids: it runs only
      # in a `trap ... EXIT` handler whose job is best-effort teardown, after
      # the hook's real pass/fail outcome is already decided by whatever ran
      # before it. Without it, `set -e` would abort cleanup() the moment
      # `rmi -f` returns non-zero (the image already gone, a daemon hiccup)
      # and skip `rm -f "${tarball}"` right after it, leaking a full image
      # archive into the system temp directory on every such run.
      - id: trivy-image-scan
        name: trivy image scan (aquasecurity/trivy)
        language: system
        files: "^(Dockerfile|Makefile|scripts/|files/bash/)"
        pass_filenames: false
        stages: [pre-push]
        entry: >-
          bash -c '
          set -euo pipefail;
          runtime=$(command -v docker || command -v podman) || {
          echo "trivy-image-scan needs docker or podman on PATH." >&2;
          exit 1;
          };
          tag="rsync-crypt:pre-push-trivy-scan-$$";
          tarball="$(mktemp)";
          cleanup() {
          "${runtime}" rmi -f "${tag}" >/dev/null 2>&1 || true;
          rm -f "${tarball}";
          };
          trap cleanup EXIT;
          "${runtime}" build -t "${tag}" .;
          "${runtime}" save -o "${tarball}" "${tag}";
          "${runtime}" run --rm
          -v "${tarball}:/image.tar:ro,Z"
          -v "$(pwd)/.trivyignore.yaml:/work/.trivyignore.yaml:ro,Z"
          -w /work
          docker.io/aquasec/trivy:0.74.0 image
          --severity CRITICAL,HIGH --exit-code 1
          --ignorefile /work/.trivyignore.yaml --input /image.tar
          '
