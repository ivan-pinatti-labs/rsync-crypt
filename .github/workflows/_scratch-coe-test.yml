name: Scratch COE Test
on:
  workflow_dispatch: {}
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Step A (ok)
        run: echo "ok"
      - name: Step B (fails, continue-on-error)
        id: step-b
        continue-on-error: true
        run: exit 1
      - name: Step C (no if condition, default success())
        run: echo "Step C ran"
