name: Publish Image

# Builds the Docker image and pushes it to
# ghcr.io/ivan-pinatti-labs/rsync-crypt, tagged 'latest' and with the exact
# semantic version merge.yml already minted for the release.
#
# Trigger: 'release: published', not a 'workflow_run' reacting to merge.yml
# and not a raw tag push. merge.yml's own two jobs already do the two things
# a trigger here would otherwise have to re-derive:
#
#   - create-tag (mathieudutour/github-tag-action) computes the next semver
#     tag and creates the git tag.
#   - create-release (ncipollo/release-action) turns that tag into a GitHub
#     Release.
#
# 'release: published' fires once that second job finishes, and its payload
# (github.event.release.tag_name) already carries the exact tag create-tag
# minted, so this workflow never has to recompute a version itself. A
# 'workflow_run' trigger watching merge.yml would still need something to
# read the tag back out of the completed run (a second API call, or an
# artifact create-tag never uploads), and it would fire even if
# create-release's job failed after create-tag's succeeded, i.e. on a tag
# with no release behind it. A raw tag push ('push: tags: v*') would fire a
# commit earlier than 'release: published' does, before the release (and its
# changelog body) exists at all, for no benefit here since nothing in this
# workflow reads the release body. 'release: published' is therefore the one
# trigger that names the finished artifact (the release) this workflow
# actually republishes as an image, with no re-derivation and no ordering
# gap.
#
# It is also, on its own, a trigger that never fires for the release
# merge.yml actually creates. create-release calls ncipollo/release-action
# with no 'token:' override, so it defaults to GITHUB_TOKEN, and GitHub does
# not start new workflow runs from an event a GITHUB_TOKEN created, release
# creation through the API included, specifically to stop workflows
# triggering each other in a loop. This is the exact same restriction
# CLAUDE.md documents for resolve-apk-pins.yml's push, and the fix is the
# same shape: merge.yml's own 'trigger-image-publish' job explicitly
# dispatches this workflow right after create-release finishes, via
# 'gh workflow run publish-image.yml --field tag=<tag> --field
# publish_latest=true' (needs 'actions: write', not a stored credential).
# 'release: published' is left in place regardless, for the one case that
# dispatch cannot cover: a release published by hand, or by a real user
# token, through the GitHub UI or API rather than by merge.yml.
#
# workflow_dispatch exists for two things: it is what merge.yml's own dispatch
# above rides on, and it is also how this workflow gets tested directly
# (build, push, verify) without waiting for a real release. Either way it
# takes its own 'tag' input rather than reading github.event.release.tag_name,
# which does not exist outside a 'release' event.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Version tag to publish as the image tag, e.g. '0.0.0-test'. A real
          release always uses the release's own tag_name when triggered
          natively; merge.yml's dispatch passes this explicitly instead,
          since GITHUB_TOKEN release creation carries no event of its own to
          read a tag_name from (see the comment above).
        required: true
        default: "0.0.0-manual"
      publish_latest:
        description: >-
          Also push the ':latest' tag. merge.yml's dispatch sets this for a
          genuine release; leave it false for an ad hoc manual test so a
          throwaway tag never clobbers ':latest'.
        type: boolean
        required: false
        default: false

concurrency:
  # Keyed on the version being published, not github.ref: the republish
  # guard below (`docker buildx imagetools inspect`, then build) is a
  # read-then-act check with no lock of its own, so two runs that both
  # resolve to the same VERSION need to serialize against each other or
  # both can pass the "does this tag exist yet" read before either has
  # pushed, and both then push. github.ref does not protect against that
  # for workflow_dispatch specifically: it is the ref the workflow was
  # dispatched *from* (almost always the default branch), completely
  # independent of the 'tag' input actually being published, so two manual
  # dispatches of the same tag from two different refs would previously
  # have raced right past this. github.event.release.tag_name covers the
  # 'release' trigger the same way; only one of the two is ever set on a
  # given run.
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions: {}

env:
  IMAGE_GHCR: ghcr.io/ivan-pinatti-labs/rsync-crypt
  # Same account, same credentials the read-only Docker Hub Probe job in
  # pull-request-validation.yml already exercises every pull request; see
  # DOCKERHUB_USERNAME/DOCKERHUB_TOKEN below for the push side of that.
  IMAGE_DOCKERHUB: docker.io/ivanpinatti/rsync-crypt

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    # amd64 alone builds in a couple of minutes; arm64 goes through QEMU
    # emulation for every apk transaction the Dockerfile runs, which is
    # noticeably slower for the same image. 30 minutes leaves headroom for
    # that without masking a genuine hang.
    timeout-minutes: 30
    permissions:
      contents: read
      # GITHUB_TOKEN scoped to packages: write on this job is sufficient to
      # push to ghcr.io/ivan-pinatti-labs/rsync-crypt, which lives under
      # this repository's own owner; no personal access token or other
      # stored secret is required. The Docker Hub push instead uses the
      # long-lived DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets below, since
      # GITHUB_TOKEN has no reach outside github.com.
      packages: write
      # Lets cosign request a short-lived Fulcio certificate bound to this
      # run's own OIDC identity (keyless signing, below), instead of a
      # stored private signing key.
      id-token: write
      # Lets the Docker Scout SARIF upload (below) attach its findings to
      # this repository's code scanning tab.
      security-events: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish_latest: ${{ steps.version.outputs.publish_latest }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Determine the version tag
        id: version
        # github-tag-action's default tag_prefix is 'v' and merge.yml does not
        # override it, so github.event.release.tag_name arrives as 'vX.Y.Z'.
        # The image tag drops the 'v': published tags here read '1.2.0', not
        # 'v1.2.0'.
        #
        # Both untrusted values are passed through env: rather than
        # interpolated directly into the script, so a release tag or a
        # workflow_dispatch input crafted as shell syntax is read as an inert
        # string, not executed.
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            tag="$RELEASE_TAG_NAME"
            publish_latest=true
          else
            tag="$DISPATCH_TAG"
            publish_latest="$DISPATCH_PUBLISH_LATEST"
          fi
          if [ -z "$tag" ]; then
            echo "::error::No version tag resolved from the triggering event."
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "publish_latest=$publish_latest" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        # Same pinned action as the GHCR login above, a second session
        # alongside it: 'docker/metadata-action' below tags this one build
        # for both registries, so both need to be logged in before
        # 'docker/build-push-action' pushes.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Refuse to republish a version tag that already exists
        # The incident this exists to stop from recurring: publish-image.yml
        # was re-dispatched by hand with tag=1.5.0, a version already
        # released. Nothing about the source tree had changed, but the image
        # built from it had: the Dockerfile runs `apk update && apk upgrade`
        # and its `~=` pins constrain a minor version, not an exact one, so
        # Alpine's mirrors moving underneath an unchanged pin is enough for a
        # rebuild to be different bytes. Docker Hub refused the overwrite,
        # because its tag immutability rule (already configured there, regex
        # '^\d+\.\d+\.\d+$') is exactly this check. GHCR has no equivalent
        # setting at all and accepted it silently, which left GHCR's 1.5.0
        # and both registries' 'latest' pointing at a different, unsigned
        # build than Docker Hub's 1.5.0. See issue #55:
        # https://github.com/ivan-pinatti-labs/rsync-crypt/issues/55
        #
        # So this is GHCR's missing immutability rule, enforced in the one
        # place that can enforce it for a registry that will not: before the
        # build, in the workflow that does the pushing. It runs after both
        # logins on purpose, since `imagetools inspect` needs the same
        # credentials the push will, and before the build so a refusal costs
        # nothing but the checkout.
        #
        # Only bare semver is gated. '0.0.0-test', '0.0.0-manual' and any
        # other non-semver tag are meant to be reused, run after run, for
        # manual validation dispatches, and they are also exactly what Docker
        # Hub's own immutability regex declines to match, so gating them here
        # would be this workflow disagreeing with the registry it is
        # mirroring the rule from.
        #
        # Only a workflow_dispatch is gated, for the reason the header
        # explains at length: a native 'release' event fires for a release
        # someone published by hand, where re-publishing an existing tag may
        # well be the intent, and merge.yml's create-tag job mints a version
        # nothing has used before every time. Note that merge.yml's release
        # path reaches this workflow as a workflow_dispatch rather than a
        # 'release' event (GITHUB_TOKEN-created releases start no runs, see
        # the header), so this check does run for a genuine release. That is
        # harmless in the ordinary case, since the tag genuinely does not
        # exist yet, and is a free second opinion on create-tag's uniqueness
        # if that ever stops being true.
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Bare semver only, anchored end to end: '1.5.0' is gated,
          # '0.0.0-test' and '1.5.0-rc1' are not. grep rather than a case
          # pattern because a glob cannot require "digits" the way a
          # character class repetition can, and this is the same shape as
          # Docker Hub's own immutability regex on purpose.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::notice::${VERSION} is not bare semver, so it is reusable by design."
            exit 0
          fi

          # A successful inspect means "this tag exists", unambiguously. A
          # failed one used to mean "it does not" outright, which was fail
          # open in the one direction that matters least: Docker Hub still
          # enforces its own immutability rule server side regardless of what
          # this step concludes, but GHCR does not, and GHCR not existing is
          # exactly the incident (#55) this check exists to catch. A
          # transient GHCR error (a registry blip, a rate limit, a timeout)
          # read as "absent" would wave through the exact overwrite this step
          # is for, on the one registry with nothing else standing in the
          # way.
          #
          # So a failure is only ever "absent" once the registry has actually
          # said so: `imagetools inspect` surfaces a real 404 as
          # 'MANIFEST_UNKNOWN' or 'manifest unknown' (both registries) or a
          # plain 'not found', regardless of which one of the two rejected
          # it. Anything else, an auth hiccup, a timeout, a 5xx, an error
          # this check does not recognize, is inconclusive rather than
          # "absent", and 3 attempts with a short backoff exist only to let a
          # genuinely transient one clear before treating it as a hard
          # failure, since both logins above already succeeded by the time
          # this runs and a real auth problem would have failed the job
          # there instead of arriving here.
          check_tag() {
            local image="$1" attempt output
            for attempt in 1 2 3; do
              if output=$(docker buildx imagetools inspect "$image" 2>&1); then
                return 0 # confirmed present
              fi
              if printf '%s' "$output" \
                | grep -qiE 'manifest_unknown|manifest unknown|not found|no such manifest'; then
                return 1 # confirmed absent
              fi
              echo "::warning::Inconclusive inspect of ${image}" \
                "(attempt ${attempt}/3): ${output}"
              sleep $((attempt * 5))
            done
            echo "::error::Could not confirm whether ${image} exists after" \
              "3 attempts; last result: ${output}"
            exit 2
          }

          published=""
          for image in "$IMAGE_GHCR" "$IMAGE_DOCKERHUB"; do
            if check_tag "${image}:${VERSION}"; then
              published="${published} ${image}:${VERSION}"
            fi
          done

          if [ -z "$published" ]; then
            echo "::notice::${VERSION} is not published on either registry yet."
            exit 0
          fi

          # Assembled rather than written as one long line: a GitHub
          # annotation is a single line, and this file's own 100 column limit
          # is not somewhere to smuggle an exception.
          reason="Version ${VERSION} is already published on:${published}."
          reason="${reason} Rebuilding a released version tag does not reproduce"
          reason="${reason} the image it already points at, because the"
          reason="${reason} Dockerfile's apk pins constrain a minor version and"
          reason="${reason} Alpine's mirrors move within it, so this would"
          reason="${reason} replace a signed, released image with different"
          reason="${reason} bytes under the same name. Docker Hub refuses this"
          reason="${reason} itself; GHCR does not, which is what this check is"
          reason="${reason} for (issue #55). Publish a new version instead, or"
          reason="${reason} dispatch with a non-semver tag such as 0.0.0-test"
          reason="${reason} for a manual validation run."
          echo "::error::${reason}"
          exit 1

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Both registries, one buildx invocation, one shared digest: the
          # tags below fan out across both automatically.
          images: |
            ${{ env.IMAGE_GHCR }}
            ${{ env.IMAGE_DOCKERHUB }}
          # 'latest' is enabled for a native 'release' event and for
          # merge.yml's dispatch (which passes publish_latest=true), and
          # disabled for an ad hoc manual workflow_dispatch test run, so a
          # throwaway test tag is never mistaken for the current release.
          tags: |
            type=raw,value=latest,enable=${{ steps.version.outputs.publish_latest == 'true' }}
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Build and push
        id: build
        # No 'build-args:' input, deliberately. Every version this image is
        # built from (ALPINE_VERSION, GOCRYPTFS_VERSION, BASH_VERSION,
        # LESS_VERSION, OPENSSH_VERSION, RSYNC_VERSION, SSHFS_VERSION,
        # VIM_VERSION) is an ARG default in the Dockerfile itself, kept
        # correct by .github/workflows/resolve-apk-pins.yml on every
        # ALPINE_VERSION bump, so passing them here would only be restating
        # the file's own defaults back to it and creating a second place they
        # could drift from. A preceding step used to read all eight out of
        # .env.example for exactly that; it was removed with the pins.
        #
        # This is also what keeps a published image identical to a local
        # 'make build': that target now passes a --build-arg only for a value
        # a user explicitly overrode on the command line, and passes none at
        # all by default, which is the same build this step performs.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attaches a Software Bill of Materials and full (every
          # platform, every build stage) SLSA provenance to the pushed
          # manifest, so a puller, or Docker Scout below, can inspect what
          # went into the image and how it was built, rather than just
          # trusting the tag.
          sbom: true
          provenance: mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the published images
        # Keyless signing: cosign requests a short-lived certificate from
        # Fulcio bound to this run's OIDC identity (the 'id-token: write'
        # permission above), signs both refs with it, and records the
        # signatures in Rekor's public transparency log. No signing key is
        # stored anywhere; the README's 'cosign verify' snippet checks a
        # pulled image back against this exact workflow's identity. Both
        # registries share the one digest the single buildx invocation
        # above minted, so one 'cosign sign' call covers both refs.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes \
            "${{ env.IMAGE_GHCR }}@${DIGEST}" \
            "${{ env.IMAGE_DOCKERHUB }}@${DIGEST}"

      - name: Sync the Docker Hub description from README
        # Gated on publish_latest the same way ':latest' is, plus a check on
        # who triggered the run: workflow_dispatch accepts publish_latest
        # from any caller with write access, so publish_latest alone would
        # let a human's ad hoc test dispatch (publish_latest=true, no real
        # release behind it) overwrite the public Docker Hub listing.
        # merge.yml's own dispatch is the only intended workflow_dispatch
        # caller for a genuine release, and it authenticates with
        # GITHUB_TOKEN via 'gh workflow run' (see merge.yml), which always
        # runs as 'github-actions[bot]' (see coderabbit-review-queue.yml's
        # comment on the same fact). Requiring that actor for the
        # workflow_dispatch case, in addition to a native 'release' event,
        # keeps a manually triggered run from reaching this step even when
        # it sets publish_latest=true itself.
        #
        # That audit's real target is a 'pull_request_target' workflow
        # trusting 'github.actor' as a stand-in for who authored a PR's HEAD
        # commit, which is spoofable because a PR's commit history can carry
        # an earlier, attacker-controlled commit under a later one authored
        # by the trusted bot. Nothing here derives from PR commit authorship;
        # this step reacts to a 'workflow_dispatch' API call, where
        # 'github.actor' is GitHub's own record of which authenticated
        # identity made that call, not something read out of ref content a
        # caller controls. Reaching this line already requires write access
        # to trigger workflow_dispatch at all, and 'github-actions[bot]' is a
        # reserved identity no such caller can assume by choice, only by
        # dispatching through GITHUB_TOKEN the way merge.yml does.
        if: | # zizmor: ignore[bot-conditions]
          steps.version.outputs.publish_latest == 'true' &&
          (github.event_name == 'release' || github.actor == 'github-actions[bot]')
        # continue-on-error: Docker Hub's description-update endpoint only
        # accepts password-based JWT login, not a Personal Access Token, and
        # DOCKERHUB_TOKEN here is a PAT (see the login step above). That is a
        # platform limitation, not a misconfiguration on our end: filed
        # upstream at docker/roadmap#323 (pre-existing) and confirmed again in
        # our own docker/roadmap#918 and docker/hub-feedback#2532. Storing an
        # actual account password as a CI secret to work around it would be a
        # strictly worse security posture than the PAT already in use, so
        # this step is left to fail with a 403 and the job carries on: image
        # signing (above) and the vulnerability scan plus verify matrix
        # (below) must never be blocked by a Docker Hub listing that failed
        # to refresh. v1.5.0's publish run
        # (https://github.com/ivan-pinatti-labs/rsync-crypt/actions/runs/33903867494)
        # hit exactly this in production, which is what surfaced the gap.
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ivanpinatti/rsync-crypt
          readme-filepath: ./README.md

      - name: Scan the Docker Hub image for known vulnerabilities
        # Report-only: no 'exit-code' input is set, so a finding here never
        # fails this job or blocks a publish; this is visibility (the SARIF
        # upload below, surfaced in this repository's code scanning tab),
        # not a release gate. Docker Scout's own Dashboard health-score
        # badge was retired 2026-07-01 (see docs.docker.com's "Deprecated
        # and retired Docker products and features"), so code scanning is
        # the durable place this scan's findings show up; the
        # 'docker/scout-action' CI action itself is explicitly unaffected by
        # that retirement. Scanned against the Docker Hub ref specifically
        # because that is where 'docker scout' attributes CVE data by
        # default; the two registries share the same digest either way.
        uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
        with:
          command: cves
          image: ${{ env.IMAGE_DOCKERHUB }}@${{ steps.build.outputs.digest }}
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          sarif-file: scout-results.sarif

      - name: Upload the vulnerability scan to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: scout-results.sarif

  verify:
    name: Verify Published Image (${{ matrix.registry }})
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Read-only: this job only pulls what the previous job already pushed.
      packages: read
    strategy:
      # fail-fast: false so a broken Docker Hub leg doesn't cancel the GHCR
      # leg (or vice versa); both registries get a full, independent report
      # every run instead of whichever one happened to fail first.
      fail-fast: false
      matrix:
        registry: [ghcr, dockerhub]
        include:
          - registry: ghcr
            login_registry: ghcr.io
          - registry: dockerhub
            login_registry: docker.io
    steps:
      # Credentials are picked with a ternary here, not carried on the
      # matrix itself: 'secrets' is available wherever this expression is
      # evaluated (a step's 'with:' or 'env:'), but not inside
      # 'strategy:'/'matrix:', so the 'include:' above only ever carries the
      # non-secret login_registry host and the registry stays the sole
      # branch key.
      - name: Log in to ${{ matrix.registry }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ matrix.login_registry }}
          username: ${{ matrix.registry == 'ghcr' && github.actor ||
            secrets.DOCKERHUB_USERNAME }}
          password: ${{ matrix.registry == 'ghcr' && secrets.GITHUB_TOKEN ||
            secrets.DOCKERHUB_TOKEN }}

      - name: Pull the published image by digest
        # By digest, not by the 'latest' or version tag: a tag can move
        # between the push above and this pull, a digest cannot, so this is
        # proof the exact image just built is what gets verified. Both
        # registries share the one digest the single buildx invocation in
        # build-and-push minted, so both legs of this matrix verify the
        # same bytes, just fetched from a different registry.
        env:
          IMAGE: ${{ matrix.registry == 'ghcr' && env.IMAGE_GHCR || env.IMAGE_DOCKERHUB }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: docker pull "${IMAGE}@${DIGEST}"

      # Same checks tests/test_build.py runs against a locally built image
      # (test_required_binary_is_present, test_entrypoint_is_gocryptfs,
      # test_image_runs_as_the_crypt_user), reused here directly against the
      # freshly pushed image rather than pointed at through pytest: that
      # suite's 'image' fixture builds locally via 'make build' and has no
      # existing seam for a pre-built remote ref, and duplicating its handful
      # of docker run assertions here is simpler than adding one. Run once
      # per matrix leg so a registry-specific problem (a stale digest, a
      # broken pull) is never masked by the other registry's success.
      - name: Verify required binaries are present
        env:
          IMAGE: ${{ matrix.registry == 'ghcr' && env.IMAGE_GHCR || env.IMAGE_DOCKERHUB }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          set -euo pipefail
          for binary in gocryptfs rsync sshfs fusermount ssh sshd; do
            docker run --rm --entrypoint /bin/bash \
              "${IMAGE}@${DIGEST}" \
              -c "command -v ${binary}"
          done

      - name: Verify the entrypoint is gocryptfs and starts without error
        env:
          IMAGE: ${{ matrix.registry == 'ghcr' && env.IMAGE_GHCR || env.IMAGE_DOCKERHUB }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          set -euo pipefail
          entrypoint=$(docker inspect -f '{{json .Config.Entrypoint}}' "${IMAGE}@${DIGEST}")
          case "$entrypoint" in
            *gocryptfs*) ;;
            *)
              echo "::error::Entrypoint is not gocryptfs: $entrypoint"
              exit 1
              ;;
          esac
          docker run --rm --entrypoint /usr/bin/gocryptfs "${IMAGE}@${DIGEST}" -version

      - name: Verify the image runs as the crypt user
        env:
          IMAGE: ${{ matrix.registry == 'ghcr' && env.IMAGE_GHCR || env.IMAGE_DOCKERHUB }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          set -euo pipefail
          resolved=$(docker run --rm --entrypoint id "${IMAGE}@${DIGEST}" -un)
          [ "$resolved" = "crypt" ]
