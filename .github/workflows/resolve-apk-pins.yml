name: Resolve apk Pins

# GOCRYPTFS_VERSION, BASH_VERSION, LESS_VERSION, OPENSSH_VERSION,
# RSYNC_VERSION, SSHFS_VERSION and VIM_VERSION are `ARG` defaults in the
# Dockerfile, and each is an apk `~=` version constraint, not a Docker tag: no
# Renovate datasource models "the version of this apk package available in
# Alpine release X", so an independently tracked bump could propose a version
# that release's repo does not carry and fail the build (see
# .github/renovate.json5's customManagers comment). They used to be
# re-resolved by hand, every time ALPINE_VERSION moved, by running
# `apk policy <pkg>` inside the new `alpine:<version>` and editing the pins.
# This workflow is that step, automated: it runs scripts/resolve-apk-pins.py,
# which does exactly that, against the ALPINE_VERSION a Renovate pull request
# proposes, and pushes a second commit onto the same pull request if anything
# resolved differently.
#
# All eight pins, ALPINE_VERSION included, used to live in `.env.example` as
# quoted `NAME="value"` lines, and this workflow read and rewrote that file.
# They are `ARG NAME=value` defaults in the `Dockerfile` now, so that the file
# consuming a version is also the file declaring it and a plain
# `docker build .` needs no build arguments at all. Nothing about the trust
# model below changed with them; only which file is fetched from the pull
# request's branch and what grammar the script edits.
#
# Each of the seven ARGs carries a `# apk-pin: resolved-from=ALPINE_VERSION`
# comment immediately above it, not `# renovate:`, on purpose: that is what
# scripts/assert-pin-only-diff.py's Pin Only check reads to decide a bump to
# one of them is a pin bump and not "a dependency bot reaching outside its
# lane" (see that script's APK_PIN_ANNOTATION). Renovate's own custom regex
# manager is anchored to `# renovate:` specifically, so it never matches this
# marker and never tries to track these seven independently, which is the
# exact failure they were kept out of Renovate's hands to avoid in the first
# place.
#
# Why GITHUB_TOKEN pushes the commit, and re-triggers the required checks by
# hand:
# GitHub does not start new workflow runs from a push authenticated with the
# default GITHUB_TOKEN, specifically to stop workflows triggering each other
# in a loop (the same restriction bot-auto-merge.yml's own comments rely on
# for `workflow_run` over `status`). Left there, that would leave the
# resolver's commit sitting on the pull request with none of `Tests`, `Pin
# Only` or `Review Verified` ever re-run against it, which fails the one
# requirement this workflow cannot compromise on: "don't build a parallel
# test or review path", the real jobs that publish those three have to grade
# this commit the normal way.
#
# The anti-recursion rule has one documented exception: an explicit
# `workflow_dispatch` call made through the API is exempt even when made with
# GITHUB_TOKEN, because that call is the workflow deliberately asking for
# another run rather than a push incidentally causing one. So instead of a
# stored credential whose only job is to look like a human push, the "Re-
# trigger pull request validation" and "Re-trigger the CodeRabbit gate"
# steps, right after the push below lands, dispatch the two workflows that
# publish those three checks directly:
#
#   - `pull-request-validation.yml` carries a `workflow_dispatch` trigger
#     (added alongside this change) for `Pre-commit` and `Tests`.
#   - `coderabbit-gate.yml` already had one, `pr_number`, its own "manual
#     recovery path" for a pull request stuck with a stale or missing
#     verdict; this reuses it rather than adding a second mechanism, for
#     `Pin Only` and `Review Verified`. Finishing that run also fires
#     bot-auto-merge.yml's `workflow_run` trigger, which is what actually
#     supplies the approval once every required check reads green.
#
# Both calls need `actions: write`, granted below, the same way the push
# needs `contents: write`; all three are GITHUB_TOKEN, scoped down to this
# job, with no separate secret to create, rotate or lose.
#
# Branch protection matches a required check by name and by the commit SHA
# the check run reports against, not by which event produced the run, so a
# check run started this way satisfies the pull request's requirement for
# its head SHA exactly as one from the ordinary trigger would.
#
# The failure mode this is defensively built around: Renovate's default
# `rebaseWhen` can rebase or recreate its branch on its own (a later daily
# run, or the base branch advancing), which can drop this workflow's commit
# the same way any rebase drops a commit not present on the new base. Nothing
# here can prevent that rebase; what makes it survivable is that dropping the
# commit does not desynchronize anything silently. A rebase changes the head
# SHA, which is a `synchronize` event, which re-triggers this workflow, which
# recomputes from scratch and reads whatever Dockerfile the rebased branch
# actually carries. If the rebase dropped the fix, recomputation finds the
# same mismatch again and pushes the same fix again; if the rebase somehow
# kept it, recomputation finds every value already resolved and pushes
# nothing (`scripts/resolve-apk-pins.py` is idempotent by construction: it
# only ever writes a value that differs from what is already there). Either
# way the branch converges back to "every apk pin matches the ALPINE_VERSION
# it carries" without anyone having to notice the rebase happened. That
# `synchronize` has to be a genuine push from Renovate's own bot identity,
# not from GITHUB_TOKEN: this workflow's own commit below is pushed with
# GITHUB_TOKEN precisely so it does not retrigger `pull_request_target` here,
# the same anti-recursion rule described above, just working in this
# workflow's favor instead of against it this time. There is no second run of
# this workflow to reason about after a self-push, and so no loop to guard
# against; the two `workflow_dispatch` re-triggers a few paragraphs up are a
# narrower, explicit ask of two specific workflows
# (`pull-request-validation.yml` and `coderabbit-gate.yml`), not a broad
# synchronize this workflow itself would otherwise also react to.
on:
  # zizmor: ignore[dangerous-triggers]
  #
  # Flagged by default, and the reasoning is bot-auto-merge.yml's: the branch
  # this reacts to is never a fork's (guarded below), so nothing here is
  # handing a write-scoped token to code an outside contributor controls.
  # Unlike bot-auto-merge.yml and coderabbit-gate.yml, this workflow does
  # check out pull request content, deliberately: it has to read the
  # ALPINE_VERSION the pull request proposes and, if it resolves something
  # different, commit onto that same branch. What stays off the pull
  # request's copy is the code that decides what to do with that content: the
  # scripts run in every step below are read from the base branch's checkout,
  # a separate step, never from the pull request's own copy of them. See "Fetch
  # the pull request's branch into its own worktree" and "Resolve apk pins"
  # for exactly what is and is not read from where.
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      # The Dockerfile, not .env.example: that is where all eight version pins
      # live now (see the header above). A Renovate pull request that bumps
      # ALPINE_VERSION touches this file and nothing else.
      - "Dockerfile"

# The floor. The job below grants itself contents: write and actions: write
# on GITHUB_TOKEN explicitly, scoped to that one job rather than raised here,
# see the header above for why both are needed.
permissions:
  contents: read

jobs:
  resolve:
    name: Re-resolve the apk pins for the proposed Alpine version
    # Exact equality against renovate[bot], the same fence bot-auto-merge.yml
    # uses for the same reason: user.login is set by GitHub from the
    # authenticated author and cannot be spoofed by a pull request body, and
    # the non-fork check is what makes checking out and pushing to this
    # branch safe at all, since a fork's branch is not one this repository's
    # credentials should ever be pushed to.
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One at a time per pull request. Renovate can push more than once in
    # quick succession on its own (a rebase landing moments after the
    # original open, say), each a genuine `synchronize`; two overlapping runs
    # computing against two different heads and racing to push would be
    # exactly the pile-up bot-auto-merge.yml's concurrency groups exist to
    # prevent, for the same reason. This workflow's own commit below no
    # longer adds to that risk, since it pushes with GITHUB_TOKEN and does not
    # produce a `synchronize` this workflow reacts to (see the header above),
    # but the concurrency group still guards against Renovate's own
    # back-to-back pushes. Queued rather than cancelled: a superseded run has
    # nothing worth cancelling towards, but a cancelled one might have been
    # the run that would have pushed the correct fix for the head that
    # mattered.
    concurrency:
      group: resolve-apk-pins-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out the default branch
        # Explicit, and load-bearing: this is what makes scripts/resolve-apk-pins.py
        # and scripts/assert-pin-only-diff.py's own APK_PIN_ANNOTATION the
        # trusted, reviewed copies rather than whatever a compromised or
        # misconfigured bot might have rewritten them to say on its own
        # branch. Only the Dockerfile, fetched separately below, is ever read
        # from the pull request's branch.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Fetch the pull request's branch into its own worktree
        id: fetch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth 1 origin "$HEAD_REF"
          # A worktree, not a checkout of this same clone: the commit below
          # has to land on top of the pull request's actual current head, not
          # on top of the base branch this step's own checkout is sitting on.
          # Checking FETCH_HEAD out in place here would overwrite that base
          # branch checkout, including the trusted copies of the scripts the
          # next step still needs to run from; a worktree keeps the two
          # entirely separate on disk while sharing the same object store, so
          # nothing has to be re-fetched or re-cloned to get both at once.
          git worktree add ../pr-branch FETCH_HEAD

          # Only worth acting on this pull request at all if ALPINE_VERSION
          # itself actually moved: the paths filter above already narrows
          # this to a pull request that touched the Dockerfile, but Renovate's
          # custom regex manager is the only thing that ever edits that file
          # on Renovate's own branches, and it only ever touches
          # ALPINE_VERSION, so this is a defensive check against that
          # assumption changing later rather than a condition expected to
          # ever actually trip. It matters slightly more than it used to: the
          # paths filter now names a file a human edits for unrelated reasons
          # (a new apk package, a new COPY), where `.env.example` was only
          # ever touched by Renovate. Those pull requests are not Renovate's
          # and never reach this job at all, but the check is what makes that
          # not depend on the author fence alone.
          base_alpine=$(grep -E '^ARG ALPINE_VERSION=' Dockerfile)
          head_alpine=$(grep -E '^ARG ALPINE_VERSION=' ../pr-branch/Dockerfile)
          if [ "$base_alpine" = "$head_alpine" ]; then
            echo "::notice::ALPINE_VERSION did not change on this pull request; nothing to resolve."
            echo "alpine_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "alpine_changed=true" >> "$GITHUB_OUTPUT"

          # Digits and dots only, matching resolve-apk-pins.py's own
          # SAFE_ALPINE_VERSION check. Defence in depth: the script already
          # refuses anything else before it reaches `docker run`, but failing
          # here, before this value is interpolated into any command at all,
          # is cheaper than trusting a second layer to catch what the first
          # one should never have let through.
          alpine_version=$(printf '%s\n' "$head_alpine" | sed -E 's/^ARG ALPINE_VERSION=(.*)$/\1/')
          case "$alpine_version" in
            '' | *[!0-9.]*)
              echo "::error::ALPINE_VERSION=$alpine_version is not digits and dots only."
              exit 1
              ;;
          esac
          echo "alpine_version=$alpine_version" >> "$GITHUB_OUTPUT"

      - name: Resolve apk pins
        id: resolve
        if: steps.fetch.outputs.alpine_changed == 'true'
        env:
          ALPINE_VERSION: ${{ steps.fetch.outputs.alpine_version }}
        shell: bash
        run: |
          set -euo pipefail
          # The script is the trusted copy from the base branch checkout
          # above; only the --dockerfile it rewrites, in the worktree, comes
          # from the pull request's branch.
          python3 scripts/resolve-apk-pins.py \
            --alpine-version "$ALPINE_VERSION" \
            --dockerfile ../pr-branch/Dockerfile \
            | tee resolve-output.txt
          changed=$(head -1 resolve-output.txt)
          echo "$changed" >> "$GITHUB_OUTPUT"
          # The remaining lines are the human-readable change summary, reused
          # as the commit body below; a blank summary when nothing changed is
          # fine, since the commit step is skipped in that case anyway.
          tail -n +2 resolve-output.txt > resolve-summary.txt

      - name: Commit and push if anything resolved differently
        if: steps.resolve.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          ALPINE_VERSION: ${{ steps.fetch.outputs.alpine_version }}
        working-directory: ../pr-branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile
          # $GITHUB_WORKSPACE, not a relative "../<repo name>": relative to
          # this worktree that happens to work when the checkout step's
          # default path matches the repository's own name, but the
          # environment variable is what actually names it regardless.
          {
            echo "chore: resolve apk pins for alpine $ALPINE_VERSION"
            echo
            cat "$GITHUB_WORKSPACE/resolve-summary.txt"
          } > commit-message.txt
          git commit --file commit-message.txt
          rm commit-message.txt

          # HEAD here is this worktree's own head: the pull request's actual
          # current commit, plus the one just made on top of it, which is
          # exactly what makes this a fast-forward push rather than a rewrite
          # of history the pull request's other commits are sitting on.
          # GITHUB_TOKEN, no stored credential involved. The job's own
          # contents: write permission (above) is all this needs, and this
          # is exactly the push the header comment says will not retrigger
          # this workflow.
          # That is fine: the two "Re-trigger" steps below are what start
          # `Tests`, `Pin Only` and `Review Verified` against this new
          # commit, not this push.
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            "HEAD:refs/heads/${HEAD_REF}"

      - name: Re-trigger pull request validation
        # A push authenticated with GITHUB_TOKEN, the one above, does not
        # start a new workflow run at all, for any workflow, on any trigger:
        # only an explicit workflow_dispatch call does, see the header
        # comment. `--ref` is enough for this one: none of
        # pull-request-validation.yml's jobs read `github.event.pull_request.*`
        # for their actual test logic (verified by reading that workflow
        # file), they only need the branch checked out, which
        # `workflow_dispatch` does the same way `pull_request` does, so no
        # input parameters are needed here.
        if: steps.resolve.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run pull-request-validation.yml \
            --repo "$REPO" \
            --ref "$HEAD_REF"

      - name: Re-trigger the CodeRabbit gate
        # `Tests` is not the only required check the suppressed push leaves
        # stale: `Pin Only` and `Review Verified` are published by
        # coderabbit-gate.yml, which only regrades a pull request on its own
        # pull_request_target/status/schedule/merge_group triggers, none of
        # which the push above fires either. Left alone, both statuses would
        # sit at whatever they last read for the pull request's previous
        # head, never republished for the commit this workflow just pushed,
        # so the pull request could never actually satisfy its required
        # checks for its new head SHA.
        #
        # coderabbit-gate.yml already has a workflow_dispatch input built for
        # exactly this: `pr_number`, its own "manual recovery path" for a
        # pull request stuck with a stale or missing verdict (see that
        # workflow's header comment). It never checks out the pull request's
        # branch, only reads its number, metadata and diff through the API,
        # so this call dispatches the default branch's copy of the workflow,
        # not `$HEAD_REF`, and passes the pull request number instead.
        # Finishing this run also fires bot-auto-merge.yml's own
        # `workflow_run` trigger, which is what actually supplies the
        # approval once every required check reads green; nothing further
        # needs to be dispatched for that to happen.
        if: steps.resolve.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run coderabbit-gate.yml \
            --repo "$REPO" \
            --field "pr_number=$PR_NUMBER"
