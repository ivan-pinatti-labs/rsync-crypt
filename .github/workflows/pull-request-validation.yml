name: PR Validation

on:
  pull_request:
    branches:
      - main
  # Required checks are evaluated against the merge queue's own temporary
  # commit, not a pull request's head, once the queue is enabled. Every
  # workflow that supplies a required check needs this trigger or the queue
  # stalls forever waiting for a context that never gets republished on its
  # commit; ported ahead of need, alongside coderabbit-gate.yml, so that gap
  # cannot reopen later.
  merge_group:
  # resolve-apk-pins.yml pushes its own commit onto a Renovate pull request
  # with GITHUB_TOKEN, which GitHub's anti-recursion rule keeps from starting
  # a new `pull_request: synchronize` run here; an explicit workflow_dispatch
  # call is exempt from that rule, which is what that workflow uses this
  # trigger for, right after its push, to get `Tests` to run against the new
  # commit the normal way. No inputs: none of the jobs below read
  # `github.event.pull_request.*` for their actual logic, only `actions/checkout`
  # (which defaults to the ref that triggered the run either way), so
  # `--ref <branch>` on the dispatch is sufficient on its own.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --all-files

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: pip install --requirement tests/requirements.txt

      # gocryptfs needs FUSE. The runner exposes /dev/fuse, which the Makefile
      # already passes through, but fail loudly here rather than part way
      # through a backup if that ever stops being true.
      - name: Verify FUSE is available
        run: test -c /dev/fuse

      - name: Run tests
        run: pytest tests --verbose

  docker-hub-probe:
    name: Docker Hub Probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Not a build-verification job and not a required check, see
    # docs/MERGE_PIPELINE.md. `Tests` above already builds this exact image,
    # through `make build`, as part of covering test_build.py's `image`
    # fixture, always as an anonymous pull, so this job is not closing a gap
    # in what gets built or exercised. Its actual purpose is narrower: it is
    # a live probe of the one pull path `Tests` never touches at all, the
    # credentialed one, so a contributor reading only the name should not
    # assume this job re-verifies anything `Tests` already covers.
    #
    # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN exist on this repository (added
    # 2026-08-26, ahead of the personal-account-to-organization transfer
    # docs/MERGE_PIPELINE.md's "What the transfer silently changed" section
    # describes). That transfer has since completed, and Actions secrets by
    # name are confirmed, in that section, to have survived it, so the
    # original one-time question this job was stood up to answer, "do
    # repository secrets survive the transfer," is already settled. What the
    # job still does, every pull request, is genuinely ongoing rather than
    # historical:
    #
    #   - It is the only place `docker login docker.io` is attempted, so it
    #     is what would first notice DOCKERHUB_USERNAME or DOCKERHUB_TOKEN
    #     going stale, rotated, or revoked, long after the transfer that
    #     motivated adding them.
    #   - It is the only place `FROM alpine:${ALPINE_VERSION}` is pulled
    #     authenticated rather than anonymous. `Tests`'s own `make build`
    #     never logs in, so this is the sole exercise of the
    #     credential-boosted pull path and its higher rate limit, distinct
    #     from the always-anonymous pull `Tests` performs.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN exist on this repository
        # (see the job comment above), so this branch is not the normal
        # path. It stays as a graceful fallback rather than a hard failure
        # for the day either secret is removed or revoked: an absent secret
        # is not a build failure, it is just an anonymous pull, and Docker
        # Hub allows those, rate limited rather than refused, the same way
        # integration-tests.yml handles a fork's missing credentials in
        # docker-torrent-box-with-vpn.
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$DOCKERHUB_USERNAME" ] && [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "No Docker Hub credentials configured; pulling anonymously."
            exit 0
          fi
          # Only one of the two set is a misconfiguration, not "close enough
          # to log in": `docker login --password-stdin` rejects an empty
          # password outright rather than falling back to anonymous, so
          # this has to be caught here instead of surfacing as a login
          # failure with no explanation.
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Only one of the two Docker Hub secrets is set; both are required."
            exit 1
          fi
          printf '%s' "$DOCKERHUB_TOKEN" \
            | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build the image
        # .env.example already carries every build argument `make build`
        # reads (ALPINE_VERSION, GOCRYPTFS_VERSION, DOCKER_IMAGE_TAG_NAME,
        # DOCKER_IMAGE_TAG_VERSION) and nothing else the target touches, so it
        # is used directly as ENV_FILE rather than assembling a throwaway one
        # the way tests/conftest.py's build_env_file fixture does for the
        # pytest suite, which additionally needs a session scoped image tag
        # that this job has no reason to share.
        run: make build ENV_FILE=.env.example
