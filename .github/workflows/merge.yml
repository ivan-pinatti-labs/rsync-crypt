name: Merge

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  create-tag:
    name: Create Tag
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      changelog: ${{ steps.tag_version.outputs.changelog }}
    steps:
      - name: Create Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          dry_run: false
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: .*

  create-release:
    name: Create Release
    needs: [create-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      # gh release create rather than ncipollo/release-action: gh ships
      # preinstalled on the runner and is maintained by GitHub itself, so
      # using it drops a third party action from this workflow's trust
      # boundary entirely rather than merely suppressing zizmor's
      # superfluous-actions finding on it. See #71.
      #
      # ncipollo's allowUpdates: true made the step idempotent against a
      # tag that already carries a release, which matters here because
      # create-tag has no already-tagged guard: a re-run of this workflow
      # on a commit whose tag was already minted, or whose release already
      # exists, would otherwise fail on a plain create. gh release create
      # has no single flag for that, but the failure is specific and
      # detectable (a 422 naming tag_name already exists), so falling back
      # to gh release edit on exactly that failure reproduces the same
      # create-or-update behaviour. This job does not set
      # generateReleaseNotes, the one ncipollo capability gh release edit
      # cannot also do (--generate-notes is create-only), so nothing here
      # is lost by falling back to edit.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-tag.outputs.new_tag }}
          NOTES: ${{ needs.create-tag.outputs.changelog }}
        run: |
          set -euo pipefail
          title="Release $TAG"
          if error=$(gh release create "$TAG" --title "$title" --notes "$NOTES" 2>&1); then
            echo "$error"
          elif [[ "$error" == *"already exists"* ]]; then
            echo "$error"
            echo "Release for $TAG already exists, updating it instead."
            gh release edit "$TAG" --title "$title" --notes "$NOTES"
          else
            echo "$error" >&2
            exit 1
          fi

  trigger-image-publish:
    name: Trigger Image Publish
    needs: [create-tag, create-release]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      # Explicit API dispatch, not a stored credential: the release above is
      # created by 'gh release create' with GH_TOKEN set to the default
      # GITHUB_TOKEN, and GitHub does not start new workflow runs from an
      # event a GITHUB_TOKEN created, release creation included, to
      # stop workflows retriggering each other in a loop. That would leave
      # publish-image.yml's 'release: published' trigger permanently unfired
      # for every release this workflow itself creates. The documented
      # exception is an explicit workflow_dispatch call made through the API,
      # even with GITHUB_TOKEN, which is exactly what this job makes,
      # carrying the tag create-tag already minted so publish-image.yml never
      # has to recompute it. Same shape as resolve-apk-pins.yml's own
      # workflow_dispatch re-trigger of pull-request-validation.yml; see
      # CLAUDE.md.
      actions: write
    steps:
      - name: Dispatch publish-image.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.create-tag.outputs.new_tag }}
        run: |
          set -euo pipefail
          gh workflow run publish-image.yml \
            --repo "$REPO" \
            --ref "$TAG" \
            --field tag="$TAG" \
            --field publish_latest=true
