version: 2

# Dependabot handles GitHub Actions and pre-commit hooks.
# Renovate handles .tool-versions and the version pins in .env.example,
# see renovate.json5.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: America/Toronto
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
      include: scope
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Toronto
    labels:
      - dependencies
      - pre-commit
    commit-message:
      prefix: "chore"
      include: scope
    open-pull-requests-limit: 5
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
