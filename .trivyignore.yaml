    statement: >-
      golang.org/x/crypto v0.33.0 embedded in gocryptfs v2.6.1, fixed
      upstream in v0.52.0. No gocryptfs release ships that bump yet; resolves
      when one does, or on review at expiry.
    expired_at: 2026-12-07
